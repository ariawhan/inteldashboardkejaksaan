<div class="wa-choice-modal" data-wa-choice-modal aria-hidden="true">
  <div class="wa-choice-backdrop" data-wa-choice-close></div>
  <section class="wa-choice-dialog" role="dialog" aria-modal="true" aria-labelledby="wa-choice-title">
    <button type="button" class="wa-choice-close" data-wa-choice-close aria-label="Tutup">×</button>
    <div class="wa-choice-logo"><img src="{{ url_for('static', filename='img/whatsapp-logo.svg') }}" alt="WhatsApp"></div>
    <h2 id="wa-choice-title">Kirim Laporan ke WhatsApp</h2>
    <p class="wa-choice-lead">Pilih cara pengiriman laporan.</p>
    <div class="wa-choice-options">
      <button type="button" class="wa-choice-option with-attachment" data-wa-choice="with"><strong>Dengan Lampiran</strong><span data-wa-attachment-note>Semua foto lampiran akan diunduh terlebih dahulu.</span></button>
      <button type="button" class="wa-choice-option without-attachment" data-wa-choice="without"><strong>Tanpa Lampiran</strong><span>Langsung membuka WhatsApp Web tanpa mengunduh foto.</span></button>
    </div>
  </section>
</div>
